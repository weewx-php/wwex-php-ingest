name: Sync GW1000 parser
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-gw1000
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync_gw1000.py --update
      - id: changes
        run: |
          if ! git diff --quiet -- src/weewx_php_ingest/_vendor; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install '.[test]'
          python -m pytest -q tests/test_network_sources.py tests/test_sdr.py tests/test_hardware.py
          python scripts/sync_gw1000.py
          python -m build
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/weewx_php_ingest/_vendor
          git commit -m 'Update bundled GW1000 parser'
          git push origin HEAD:main
