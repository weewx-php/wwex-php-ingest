name: Collector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh tests/installer_smoke.sh
      - run: sudo bash tests/installer_smoke.sh "$GITHUB_WORKSPACE"
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/sync_weewx.py --check
      - run: python -m pip install ./vendor/weewx -e ".[test]"
      - run: python scripts/verify_install.py .
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m build
