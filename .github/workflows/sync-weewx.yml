name: Sync WeeWX drivers
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-weewx
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: sync
        run: python scripts/sync_weewx.py
      - if: steps.sync.outputs.changed == 'true'
        run: python -m pip install ./vendor/weewx ".[test]"
      - if: steps.sync.outputs.changed == 'true'
        run: |
          python scripts/verify_install.py .
          python -m pytest -q
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m build
          sudo bash tests/installer_smoke.sh "$GITHUB_WORKSPACE"
      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor pyproject.toml
          git commit -m 'Update bundled WeeWX release and hardware drivers'
          git push origin HEAD:main
