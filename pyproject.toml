[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weewx-php-ingest"
version = "0.2.0"
description = "Durable, isolated WeeWX collectors for the weewx-php native receiver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["weewx==5.5.0", "configobj>=5.0.9,<6"]

[project.optional-dependencies]
test = ["pytest>=8", "cryptography>=46", "ruff>=0.12", "pip-audit>=2.9", "build>=1.2"]

[project.scripts]
weewx-php-ingest = "weewx_php_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["vendor"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
