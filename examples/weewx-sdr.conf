WEEWX_ROOT = /var/lib/weewx-php-ingest

[Ingest]
    collector_id = REPLACE_WITH_GENERATED_COLLECTOR_UUID
    token = REPLACE_WITH_GENERATED_TOKEN
    url = https://weather.example.com/ingest/weewx.php
    state_dir = /var/lib/weewx-php-ingest

[Station]
    station_type = RTL433
    latitude = 0
    longitude = 0
    altitude = 0, meter

[RTL433]
    driver = weewx_php_ingest.sdr
    device = 0
    frequency = 433920000
    max_sensors = 256

[StdArchive]
    record_generation = software
