WEEWX_ROOT = /var/lib/weewx-php-ingest
USER_ROOT = bin/user

[Ingest]
    collector_id = REPLACE_WITH_COLLECTOR_ID
    url = https://weather.example.org/ingest/weewx.php
    token = REPLACE_WITH_TOKEN
    state_dir = /var/lib/weewx-php-ingest
    send_interval = 10

[Stations]
    [[garden]]
        [[[Station]]]
            station_type = Vantage
            latitude = 52.52
            longitude = 13.405
            altitude = 40, meter
        [[[Vantage]]]
            driver = weewx.drivers.vantage
            type = serial
            port = /dev/serial/by-id/GARDEN_CONSOLE
        [[[StdArchive]]]
            record_generation = hardware
            archive_delay = 15
        [[[Ingest]]]
            label = Garden
            silence_timeout = 120
    [[roof]]
        [[[Station]]]
            station_type = Vantage
            latitude = 52.52
            longitude = 13.405
            altitude = 50, meter
        [[[Vantage]]]
            driver = weewx.drivers.vantage
            type = serial
            port = /dev/serial/by-id/ROOF_CONSOLE
        [[[StdArchive]]]
            record_generation = hardware
            archive_delay = 15
        [[[Ingest]]]
            label = Roof
            silence_timeout = 120
