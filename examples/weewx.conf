WEEWX_ROOT = /var/lib/weewx-php-ingest
USER_ROOT = bin/user

[Station]
    station_type = Simulator
    latitude = 52.52
    longitude = 13.405
    altitude = 40, meter

[Simulator]
    driver = weewx.drivers.simulator
    loop_interval = 2.5

[Vantage]
    driver = weewx.drivers.vantage
    type = serial
    port = /dev/serial/by-id/REPLACE_WITH_CONSOLE
    baudrate = 19200

[StdArchive]
    record_generation = hardware
    archive_delay = 15
    no_catchup = false

[Ingest]
    collector_id = REPLACE_WITH_COLLECTOR_ID
    url = https://weather.example.org/ingest/weewx.php
    token = REPLACE_WITH_TOKEN
    state_dir = /var/lib/weewx-php-ingest
    station_key = station
    send_interval = 10
