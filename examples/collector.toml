[collector]
id = "00000000-0000-0000-0000-000000000001" # Replace with the PHP-provisioned collector ID.
endpoint = "https://weather.example.org/ingest/weewx.php"
token_file = "collector.token"
state_dir = "../state"
send_interval = 10
timeout = 20
backoff_max = 900
max_packets = 128
max_bytes = 262144
max_age_seconds = 432000
# token_header = "X-WeeWX-Token"
# ca_file = "/etc/ssl/certs/private-weather-ca.pem"

[stations.garden]
label = "Garden"
config = "simulator-a.conf"
silence_timeout = 120
startup_timeout = 180
max_events = 250000
max_bytes = 268435456
min_free_bytes = 67108864
lifecycle_interval = 300
lifecycle_delay = 15

[stations.roof]
label = "Roof"
config = "simulator-b.conf"
silence_timeout = 120
startup_timeout = 180
max_events = 250000
max_bytes = 268435456
min_free_bytes = 67108864
