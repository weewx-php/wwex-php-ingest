WEEWX_ROOT = /var/lib/weewx-php-ingest
USER_ROOT = bin/user

[Ingest]
    collector_id = REPLACE_WITH_GENERATED_COLLECTOR_ID
    url = https://weather.example.org/ingest/weewx.php
    token = REPLACE_WITH_GENERATED_TOKEN
    state_dir = /var/lib/weewx-php-ingest

[Stations]
    [[airgradient]]
        [[[Station]]]
            station_type = Virtual
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[Virtual]]]
            driver = weewx_php_ingest.virtual
            loop_interval = 10
            unit_system = METRICWX
        [[[AirGradient]]]
            [[[[Sensor1]]]]
                enable = true
                hostname = 192.168.1.60
                port = 80
            [[[[LoopFields]]]]
                pm01 = pm1_0
                pm02Compensated = pm2_5
                pm10 = pm10_0
                rco2 = co2
                tvocIndex = tvocIndex
                tvocRaw = tvocRaw
                noxIndex = noxIndex
                noxRaw = noxRaw
        [[[Ingest]]]
            [[[[Services]]]]
                data_services = user.airgradient.AirGradient

    [[airlink]]
        [[[Station]]]
            station_type = Virtual
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[Virtual]]]
            driver = weewx_php_ingest.virtual
            loop_interval = 10
            unit_system = METRICWX
        [[[AirLink]]]
            [[[[Sensor1]]]]
                enable = true
                hostname = 192.168.1.61
                port = 80
        [[[Ingest]]]
            [[[[Services]]]]
                data_services = user.airlink.AirLink

    [[airq]]
        [[[Station]]]
            station_type = Virtual
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[Virtual]]]
            driver = weewx_php_ingest.virtual
            loop_interval = 10
            unit_system = METRICWX
        [[[airQ]]]
            [[[[Sensor1]]]]
                host = 192.168.1.62
                password = REPLACE_WITH_DEVICE_PASSWORD
        [[[Ingest]]]
            exclude_fields = airqDeviceID, airqStatus, airqBattery, no2
            [[[[Services]]]]
                prep_services = user.airQ_corant.AirqUnits
                data_services = user.airQ_corant.AirqService
