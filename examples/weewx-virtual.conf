WEEWX_ROOT = /var/lib/weewx-php-ingest
USER_ROOT = bin/user

[Ingest]
    collector_id = REPLACE_WITH_GENERATED_COLLECTOR_ID
    url = https://weather.example.org/ingest/weewx.php
    token = REPLACE_WITH_GENERATED_TOKEN
    state_dir = /var/lib/weewx-php-ingest

[Stations]
    [[garden]]
        [[[Station]]]
            station_type = Virtual
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[Virtual]]]
            driver = weewx_php_ingest.virtual
            loop_interval = 10
            unit_system = METRICWX
        [[[StdArchive]]]
            record_generation = software
        [[[Purple]]]
            poll_secs = 15
            [[[[Sensor1]]]]
                enable = true
                hostname = 192.168.1.50
                port = 80
        [[[Ingest]]]
            [[[[Services]]]]
                data_services = user.purple.Purple

    [[office]]
        [[[Station]]]
            station_type = Virtual
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[Virtual]]]
            driver = weewx_php_ingest.virtual
            loop_interval = 10
            unit_system = METRICWX
        [[[StdArchive]]]
            record_generation = software
        [[[Purple]]]
            poll_secs = 15
            [[[[Sensor1]]]]
                enable = true
                hostname = 192.168.1.51
                port = 80
        [[[Ingest]]]
            [[[[Services]]]]
                data_services = user.purple.Purple
