[Ingest]
    id = 11111111-1111-4111-8111-111111111111
    endpoint = https://weather.example.org/ingest/weewx.php
    token_file = /etc/weewx-php-ingest/collector.token
    state_dir = /var/lib/weewx-php-ingest

[Stations]
    [[gateway]]
        [[[Station]]]
            station_type = GW1000
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[GW1000]]]
            driver = weewx_php_ingest.gw1000
            host = auto
            port = 45000
            poll_interval = 10
            timeout = 3
            max_sensors = 256
    [[tempest]]
        [[[Station]]]
            station_type = WeatherFlowUDP
            latitude = 0
            longitude = 0
            altitude = 0, meter
        [[[WeatherFlowUDP]]]
            driver = weewx_php_ingest.weatherflow
            bind = 0.0.0.0
            port = 50222
            hub_serial =
            max_sensors = 256
